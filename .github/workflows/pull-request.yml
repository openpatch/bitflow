name: Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Build first: packages consume each other's dist, and the type check
      # reads those declarations.
      - name: Build packages
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
