name: Create Pull Request or Release

# Changesets opens a "Version Packages" PR; merging that PR is what publishes.
# Two registries come out of this one job: npm for `@bitflow/core` and
# `@bitflow/web-component`, and the two VS Code marketplaces for Bitflow Studio.
#
# npm needs no secret: both packages use trusted publishing, so the runner
# mints a short-lived OIDC token instead. That costs `id-token: write` below,
# and means *no* NPM_TOKEN in the environment — an empty or stale one lands in
# .npmrc as a bearer token and npm answers a publish with 404 Not Found, which
# is what it says instead of 401 for a write it will not authorise.
#
# Two secrets, both manual repository settings:
#
#   VSCE_TOKEN   an Azure DevOps PAT for the `openpatch` publisher, with
#                Marketplace → Manage. https://marketplace.visualstudio.com
#   OVSX_TOKEN   an Open VSX access token for the same publisher, which is
#                what VSCodium and the other non-Microsoft builds install from.
#
# The extension is `private: true` and never goes to npm; changesets versions it
# anyway (`privatePackages.version`), so the version in its package.json is
# already the new one by the time this runs.

# Merging the version PR is a push to main, which runs this again — that run
# finds no changesets left, so `publish` is what happens instead of `version`.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing. Without it the runner cannot mint an OIDC token at
  # all, and npm falls back to looking for a credential that is not there.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Full history, so changesets can write changelogs against the right
          # commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          # 11 resolves to the newest 11.x, which matters: OIDC publishing was
          # broken until 11.1.3 (pnpm/pnpm#11526) — it sent the unexpanded
          # `${NPM_TOKEN}` as a literal bearer token and got the same 404.
          version: 11
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing wants Node >= 22.14 and npm >= 11.5.1.
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Test packages
        run: pnpm test

      # Built before the publish step, not after: on the run that publishes,
      # the version PR has already been merged, so package.json carries the new
      # version and the .vsix is stamped with it. On a run that only opens the
      # PR this is thrown away.
      - name: Build vscode package
        run: pnpm --filter bitflow-studio vscode:package

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same gate as npm: only when changesets actually published something, so
      # a version PR does not ship an extension. Publishing the same version
      # twice is rejected by both marketplaces, which is the backstop.
      - name: Publish VS Code extension
        if: steps.changesets.outputs.published == 'true'
        run: |
          pnpm --filter bitflow-studio vscode:publish
          pnpm --filter bitflow-studio ovsx:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
